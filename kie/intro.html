<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 1 – 100 Thai Phrases</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a012;
    --gold-light: #fdf2d6;
    --gold-dark: #7a5e1a;
    --teal: #1a7a6e;
    --teal-light: #e6f3f1;
    --bg: #fdf6ec;
    --surface: #fff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e6dfd5;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 4rem;
  }
  header {
    background: var(--teal);
    color: #fff;
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px; right: -40px; bottom: -40px;
    background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.03) 20px, rgba(255,255,255,0.03) 40px);
    pointer-events: none;
  }
  .header-badge {
    display: inline-block;
    background: var(--gold);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Bebas Neue', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header .subtitle {
    font-size: 1.1rem;
    opacity: 0.75;
    margin-top: 6px;
    font-weight: 300;
  }

  .main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* SECTION */
  .section { margin-bottom: 2.5rem; }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* SEARCH */
  .search-wrap { margin-bottom: 1rem; }
  #search {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-light);
  }

  /* VOCAB TABLE */
  .vocab-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .vocab-table thead tr { background: var(--teal); color: #fff; }
  .vocab-table thead th { padding: 12px 14px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; text-align: left; }
  .vocab-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .vocab-table tbody tr:last-child { border-bottom: none; }
  .vocab-table tbody tr:hover { background: var(--teal-light); }
  .vocab-table td { padding: 9px 14px; font-size: 15px; vertical-align: middle; }
  .vocab-table td.num { color: var(--muted); font-size: 13px; width: 36px; }
  .vocab-table td.thai { font-size: 17px; font-weight: 600; }
  .vocab-table td.pron { color: var(--teal); font-size: 14px; font-style: italic; }
  .vocab-table td.trans { color: var(--text); font-size: 14px; }

  /* SPEAKER BUTTON */
  .speak-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 50%;
    margin-left: 6px;
    vertical-align: middle;
    opacity: 0.55;
    transition: opacity 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .speak-btn:hover { opacity: 1; background: var(--teal-light); }
  .speak-btn.speaking { opacity: 1; animation: pulse 0.8s ease-in-out infinite; }
  .speak-btn svg { width: 14px; height: 14px; fill: var(--teal); pointer-events: none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.45 } }
  .thai-wrap { display: inline-flex; align-items: center; }

  .quiz-cta {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold) 0%, var(--teal) 100%);
    color: #fff;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 24px;
    font-family: 'Bebas Neue', serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-top: 1.2rem;
    box-shadow: 0 4px 14px rgba(201,168,76,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .quiz-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(201,168,76,0.5);
  }
</style>
</head>

<header>

<div class="main">

</div>

<script>

      {thai:"ไม่รู้",phon:"mai roo",trans:"Don't know"}
  ];

  // ── Speaker SVG ──────────────────────────────────────────────
  function speakerSVG() {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
      '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>' +
      '<path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>' +
      '</svg>';
  }

  // ── TTS ──────────────────────────────────────────────────────
  let currentBtn = null;
  function speakThai(text, btn) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (currentBtn && currentBtn !== btn) currentBtn.classList.remove('speaking');
    const utter = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ", "));
    utter.lang  = 'th-TH';
    utter.rate  = 0.85;
    utter.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const thaiVoice = voices.find(v => v.lang === 'th-TH' || v.lang.startsWith('th'));
    if (thaiVoice) utter.voice = thaiVoice;
    btn.classList.add('speaking');
    currentBtn = btn;
    utter.onend = utter.onerror = () => { btn.classList.remove('speaking'); currentBtn = null; };
    window.speechSynthesis.speak(utter);
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    window.speechSynthesis.getVoices();
  }

  // ── Render rows ──────────────────────────────────────────────
  function render() {
    const tbody = document.getElementById('vocabBody');
    tbody.innerHTML = '';
    VOCAB.forEach((v, i) => {
      const tr = document.createElement('tr');

      const tdNum = document.createElement('td');
      tdNum.className = 'num';
      tdNum.textContent = i + 1;

      const tdThai = document.createElement('td');
      tdThai.className = 'thai';
      const wrap = document.createElement('span');
      wrap.className = 'thai-wrap';
      const thaiText = document.createElement('span');
      thaiText.textContent = v.thai;
      const btn = document.createElement('button');
      btn.className = 'speak-btn';
      btn.title = 'Play: ' + v.thai;
      btn.innerHTML = speakerSVG();
      btn.addEventListener('click', () => speakThai(v.thai, btn));
      wrap.appendChild(thaiText);
      wrap.appendChild(btn);
      tdThai.appendChild(wrap);

      const tdPron = document.createElement('td');
      tdPron.className = 'pron';
      tdPron.textContent = v.phon;

      const tdTrans = document.createElement('td');
      tdTrans.className = 'trans';
      tdTrans.textContent = v.trans;

      tr.appendChild(tdNum);
      tr.appendChild(tdThai);
      tr.appendChild(tdPron);
      tr.appendChild(tdTrans);
      tbody.appendChild(tr);
    });
  }
  render();

  // ── Search filter ────────────────────────────────────────────
  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const rows = document.querySelectorAll('#vocabBody tr');
    rows.forEach(tr => {
      const text = tr.textContent.toLowerCase();
      tr.style.display = (!q || text.includes(q)) ? '' : 'none';
    });
  }
</script>
