<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15133a">
<title>Thai consonants — stroke practice</title>
<style>:root{
  --bg:#faf7f0; --navy:#15133a; --gold:#c59a3c; --card:#fefdf8;
  --line:#e8e4da; --ink:#1a1a1a; --muted:#6f6b7d; --badge:#eae9ef;
  --pill:#f5eedc; --red:#a31a1a;
  --high:#1e3a6e; --high-soft:#eaf0f9; --high-line:#c6d4ea;
  --mid:#b7861f;  --mid-soft:#fdf3dd;  --mid-line:#ecd6a2;
  --low:#2f6b4f;  --low-soft:#eef7f1; --low-line:#c8e3d4;
  /* Colour of the letterform itself, by consonant class. Deliberately separate
     from --high/--mid/--low above: those tint the tiles, badges and pills and
     stay as they are. Middle class keeps --ink so it reads as plain black. */
  --glyph-high:#1e3a6e; --glyph-mid:#1a1a1a; --glyph-low:#2f6b4f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--navy);
 font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
 -webkit-text-size-adjust:100%}
@font-face{font-family:SarabunLocal;src:url('glyph/Sarabun.ttf') format('truetype');font-display:swap}
.th{font-family:SarabunLocal,'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif}

/* ---------- top bar ---------- */
.nav{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:20px;
 position:sticky;top:0;z-index:20}
.nav .brand{font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--gold)}
.nav .sub{font-size:13px;color:#b9b6cc;letter-spacing:.08em}
.nav .spacer{flex:1}
.nav a{color:#d9d7e6;text-decoration:none;font-size:14px}
.nav a:hover{color:#fff}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:16px}
.crumb a{color:#5b57a8;text-decoration:none}
.crumb a:hover{text-decoration:underline}
h1{font-size:32px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
h1 .lead{font-weight:400;font-style:italic;color:#9a97ab;font-size:22px}
.intro{color:var(--muted);max-width:66ch;line-height:1.6;font-size:15px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 6px}
.filters button{font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;
 border:1px solid var(--line);background:var(--card);color:var(--navy)}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px 12px;
 text-align:center;text-decoration:none;color:inherit;display:block;transition:.15s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,19,58,.10);border-color:#d8d2c4}
.tile .big{font-size:52px;line-height:1.05;color:var(--ink)}
.tile .nm{font-size:15px;margin-top:6px}
.tile .ph{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile .mn{font-size:12px;color:#9a97ab;font-style:italic;margin-top:1px}
/* Mnemonic icons — hand-drawn line art, one per letter. They inherit the
   consonant-class colour via currentColor, so there is no per-icon palette. */
.mnemo{width:26px;height:26px;display:block;margin:8px auto 0;opacity:.62}
.tile:hover .mnemo{opacity:1}
.idhead .mnemo{width:44px;height:44px;margin:0;opacity:.75;flex:none}
.dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%}
.dot.high{background:var(--high)}.dot.mid{background:var(--mid)}.dot.low{background:var(--low)}
.tile.high{background:var(--high-soft);border-color:var(--high-line)}
.tile.mid{background:var(--mid-soft);border-color:var(--mid-line)}
.tile.low{background:var(--low-soft);border-color:var(--low-line)}
.tile .nm{font-weight:600}
.tile.high .nm{color:var(--high)}.tile.mid .nm{color:var(--mid)}.tile.low .nm{color:var(--low)}
/* Letterform colour by class — grid tiles and the practice card heading. */
.tile.high .big{color:var(--glyph-high)}
.tile.mid  .big{color:var(--glyph-mid)}
.tile.low  .big{color:var(--glyph-low)}
.card.high .idhead .big{color:var(--glyph-high)}
.card.mid  .idhead .big{color:var(--glyph-mid)}
.card.low  .idhead .big{color:var(--glyph-low)}
.filters button.high[aria-pressed="true"]{background:var(--high);border-color:var(--high)}
.filters button.mid[aria-pressed="true"]{background:var(--mid);border-color:var(--mid)}
.filters button.low[aria-pressed="true"]{background:var(--low);border-color:var(--low)}
.card.high{border-color:var(--high-line)}.card.mid{border-color:var(--mid-line)}.card.low{border-color:var(--low-line)}
.badge.high{background:var(--high-soft);color:var(--high)}
.badge.mid{background:var(--mid-soft);color:var(--mid)}
.badge.low{background:var(--low-soft);color:var(--low)}
.pill.high[aria-pressed="true"]{background:var(--high-soft);border-color:var(--high-line)}
.pill.mid[aria-pressed="true"]{background:var(--mid-soft);border-color:var(--mid-line)}
.pill.low[aria-pressed="true"]{background:var(--low-soft);border-color:var(--low-line)}
.pill.high .ic{border-color:var(--high)}.pill.mid .ic{border-color:var(--mid)}.pill.low .ic{border-color:var(--low)}
.pill.high[aria-pressed="true"] .ic{background:var(--high)}
.pill.mid[aria-pressed="true"] .ic{background:var(--mid)}
.pill.low[aria-pressed="true"] .ic{background:var(--low)}
.tile.dim{opacity:.24}

/* ---------- section tabs ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 4px}
.tabs a{font-size:15px;padding:10px 18px;color:var(--muted);text-decoration:none;
 border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--navy)}
.tabs a[aria-current="page"]{color:var(--gold);font-weight:600;border-bottom-color:var(--gold)}
.tabs a.tab-ext{color:var(--navy)}
.tabs a.tab-ext:hover{color:var(--gold)}
.tabs .ext-arrow{font-size:.8em;opacity:.7}

/* ---------- reference tables (vowels, tones, numerals) ---------- */
.refgroup{margin-top:26px}
.refgroup h2{font-size:17px;font-weight:700;margin:0 0 2px}
.refgroup .sub{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:14px 10px 12px;text-align:center}
.rcard .form{font-size:34px;line-height:1.15;color:var(--ink)}
.rcard .nm{font-size:14px;margin-top:6px;font-weight:600}
.rcard .ph{font-size:12.5px;color:var(--muted);margin-top:2px}
.rcard .snd{display:inline-block;margin-top:7px;font-size:12px;background:var(--pill);
 border:1px solid #e0d2ab;border-radius:999px;padding:2px 10px;color:#6b5313}
.rcard .pos{font-size:11.5px;color:#9a97ab;font-style:italic;margin-top:5px}
.rcard .ar{font-size:13px;color:var(--muted);margin-top:2px}
.refgrid .tile{padding:16px 10px 14px}
.refgrid .tile .ar{font-size:12.5px;color:var(--muted);margin-top:3px}
.arrowlink{display:block;margin-top:9px;font-size:12px;color:var(--gold);font-weight:600}
.refnote{margin-top:22px;padding:12px 14px;border:1px solid var(--line);
 border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
 background:var(--card);font-size:13.5px;color:var(--muted);line-height:1.6}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--badge);color:#3b3860;
 border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;letter-spacing:.08em}
.badge .dot{position:static;width:7px;height:7px}
.idhead{display:flex;gap:16px;align-items:center;margin:18px 0 4px}
.idhead .big{font-size:66px;line-height:1;color:var(--ink)}
.idhead .nm{font-size:21px}
.idhead .ph{font-size:15px;color:#4a4760;margin-top:2px}
.idhead .mn{font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
.rowbtn{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.rowbtn button{font:inherit;font-size:14px;padding:9px 15px;border-radius:999px;cursor:pointer;
 border:1px solid var(--line);background:#fff;color:var(--navy)}
.rowbtn button:hover{background:#f3efe6}
.note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;
 color:var(--muted);line-height:1.55}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav2 a{font-size:14px;color:#5b57a8;text-decoration:none}
.nav2 a:hover{text-decoration:underline}

/* ---------- practice panel ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stage{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1/1;
 background:#fff;border-radius:12px;overflow:hidden;touch-action:none}
.stage .art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
 pointer-events:none;user-select:none}
.stage.blank .art{display:none}
.stage.shadow .art{}
.guides{position:absolute;inset:0;display:none;pointer-events:none}
.stage.blank .guides{display:block}
.guides span{position:absolute;left:5%;right:5%;border-top:2px dashed #d7d2c6}
.guides .t{top:26%}.guides .b{top:76%}
.ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.playbtn{position:absolute;inset:0;margin:auto;width:74px;height:74px;border-radius:50%;border:none;
 background:rgba(24,24,24,.58);cursor:pointer;display:flex;align-items:center;justify-content:center;
 transition:background .15s,opacity .15s;padding:0}
.playbtn:hover{background:rgba(163,26,26,.85)}
.playbtn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.playbtn .tri{width:0;height:0;border-left:24px solid #fff;border-top:15px solid transparent;
 border-bottom:15px solid transparent;margin-left:6px}
/* Play button hides in blank AND shadow modes: it sits dead centre and would
   cover the outline you are meant to be tracing. Tap Show to bring it back. */
.stage.playing .playbtn,.stage.blank .playbtn,.stage.shadow .playbtn{opacity:0;pointer-events:none}
.controls{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.pill{font:inherit;font-size:15px;padding:11px 26px;border-radius:999px;cursor:pointer;
 border:1px solid var(--line);background:#fff;color:var(--navy);
 display:inline-flex;align-items:center;gap:9px}
.pill:hover{background:#f3efe6}
.pill[aria-pressed="true"]{background:var(--pill);border-color:#e0d2ab;font-weight:600}
.pill .ic{width:17px;height:17px;border-radius:50%;border:2px solid var(--gold);display:block}
.pill[aria-pressed="true"] .ic{background:var(--gold)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;min-height:1.2em}

@media (max-width:860px){
  .detail{grid-template-columns:1fr}
  .detail .panel{order:-1}
  h1{font-size:25px} h1 .lead{font-size:17px;display:block;margin-top:2px}
  .wrap{padding:18px 14px 60px}
  .stage{max-width:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
  .tile .big{font-size:44px}
  .pill{padding:12px 20px}
}
</style>

const REF = {"vowels": [["Short vowels", [["◌ะ", "สระ อะ", "sarà à", "/a/", "after"], ["◌ิ", "สระ อิ", "sarà ì", "/i/", "above"], ["◌ึ", "สระ อึ", "sarà ɯ̀", "/ɯ/", "above"], ["◌ุ", "สระ อุ", "sarà ù", "/u/", "below"], ["เ◌ะ", "สระ เอะ", "sarà è", "/e/", "around"], ["แ◌ะ", "สระ แอะ", "sarà ɛ̀", "/ɛ/", "around"], ["โ◌ะ", "สระ โอะ", "sarà ò", "/o/", "around"], ["เ◌าะ", "สระ เอาะ", "sarà ɔ̀", "/ɔ/", "around"], ["เ◌อะ", "สระ เออะ", "sarà ə̀", "/ə/", "around"]]], ["Long vowels", [["◌า", "สระ อา", "sarà aa", "/aː/", "after"], ["◌ี", "สระ อี", "sarà ii", "/iː/", "above"], ["◌ือ", "สระ อือ", "sarà ɯɯ", "/ɯː/", "above"], ["◌ู", "สระ อู", "sarà uu", "/uː/", "below"], ["เ◌", "สระ เอ", "sarà ee", "/eː/", "before"], ["แ◌", "สระ แอ", "sarà ɛɛ", "/ɛː/", "before"], ["โ◌", "สระ โอ", "sarà oo", "/oː/", "before"], ["◌อ", "สระ ออ", "sarà ɔɔ", "/ɔː/", "after"], ["เ◌อ", "สระ เออ", "sarà əə", "/əː/", "around"]]], ["Diphthongs", [["เ◌ีย", "สระ เอีย", "sarà ia", "/ia/", "around"], ["เ◌ือ", "สระ เอือ", "sarà ɯa", "/ɯa/", "around"], ["◌ัว", "สระ อัว", "sarà ua", "/ua/", "around"]]], ["Special forms", [["◌ำ", "สระ อำ", "sarà am", "/am/", "after"], ["ไ◌", "สระ ไอ", "sarà ai", "/ai/", "before"], ["ใ◌", "สระ ใอ", "sarà ai", "/ai/", "before"], ["เ◌า", "สระ เอา", "sarà ao", "/ao/", "around"]]]], "tones": [["◌่", "ไม้เอก", "máai èek", "low tone"], ["◌้", "ไม้โท", "máai thoo", "falling tone"], ["◌๊", "ไม้ตรี", "máai trii", "high tone"], ["◌๋", "ไม้จัตวา", "máai càt-ta-waa", "rising tone"]], "numerals": [["๐", "0", "ศูนย์", "sǔun"], ["๑", "1", "หนึ่ง", "nɯ̀ng"], ["๒", "2", "สอง", "sɔ̌ɔng"], ["๓", "3", "สาม", "sǎam"], ["๔", "4", "สี่", "sìi"], ["๕", "5", "ห้า", "hâa"], ["๖", "6", "หก", "hòk"], ["๗", "7", "เจ็ด", "cèt"], ["๘", "8", "แปด", "pɛ̀ɛt"], ["๙", "9", "เก้า", "kâao"]], "vowelCount": 25};</script>
<script>
const $ = s => document.querySelector(s);
const byId = id => DATA.find(d => d.id === id);

/* Resolves once the browser has populated its voice list. Chrome returns an
   empty array from getVoices() until it loads asynchronously, so an early click
   would otherwise get no Thai voice at all. Falls through after 2s so a browser
   that never fires voiceschanged cannot hang the button. */
let _voices = null;
function voicesReady(){
  if(_voices) return _voices;
  _voices = new Promise(resolve => {
    const synth = window.speechSynthesis;
    const now = synth.getVoices();
    if(now && now.length){ resolve(now); return; }
    const done = () => resolve(synth.getVoices() || []);
    synth.addEventListener('voiceschanged', done, {once:true});
    setTimeout(done, 2000);
  });
  return _voices;
}
const CLASSNAME = {high:'High class', mid:'Middle class', low:'Low class'};

/* ---------------- section tabs ---------------- */
const TABS = [
  ['',        '#/',                  'Consonants', DATA.length],
  ['vowels',  '#/vowels',            'Vowels',     REF.vowelCount],
  ['tones',   '#/tones',             'Tone marks', REF.tones.length],
  ['numbers', '#/numbers',           'Numbers',    NUMS.length || REF.numerals.length],
  // Removed 10 Aug 2026: the "Alphabet quiz" tab next to Numbers. The game is
  // still reachable from the top bar link and from home.html, so the duplicate
  // tab was dropped. Previous version kept for reference:
  //   // Leaves the app: the recognition quiz is its own page, so it is marked with
  //   // an arrow rather than pretending to be another section of this one.
  //   ['quiz',    'glyph/alphabet.html', 'Alphabet quiz', null],
];
function tabBar(active){
  return '<nav class="tabs">' + TABS.map(([key,href,label,count]) => {
    const ext = href.charAt(0) !== '#';
    return `<a href="${href}"${key===active ? ' aria-current="page"' : ''}` +
           `${ext ? ' class="tab-ext"' : ''}>${label}` +
           `${count === null ? '' : ' (' + count + ')'}` +
           `${ext ? ' <span class="ext-arrow">↗</span>' : ''}</a>`;
  }).join('') + '</nav>';
}

/* ---------------- reference views ---------------- */
function refCard(inner){ return `<div class="rcard">${inner}</div>`; }

function renderVowels(){
  const groups = REF.vowels.map(([title, rows]) => `
    <section class="refgroup">
      <h2>${title}</h2>
      <div class="sub">${rows.length} forms</div>
      <div class="refgrid">${rows.map(([form,thai,ph,snd,pos]) => refCard(
        `<div class="form th">${form}</div><div class="nm th">${thai}</div>
         <div class="ph">${ph}</div><span class="snd">${snd}</span>
         <div class="pos">${pos} the consonant</div>`)).join('')}</div>
    </section>`).join('');
  $('#app').innerHTML = `
    <div class="crumb">Thai alphabet</div>
    <h1>Thai vowels <span class="lead">— ${REF.vowelCount} forms.</span></h1>
    <p class="intro">Vowels are written before, after, above or below the consonant they follow in
      speech — and sometimes wrap around it. ◌ marks where the consonant sits.</p>
    ${tabBar('vowels')}${groups}
    <div class="refnote">Reference only. Stroke-order animations exist for the 44 consonants;
      vowels have no verified stroke data yet, so there is nothing to practise here.</div>`;
}

function renderTones(){
  $('#app').innerHTML = `
    <div class="crumb">Thai alphabet</div>
    <h1>Tone marks <span class="lead">— ${REF.tones.length} marks, 5 tones.</span></h1>
    <p class="intro">Thai has five tones: mid, low, falling, high and rising. Only four are written,
      and the mark alone does not fix the tone — the consonant class and syllable ending decide it too.</p>
    ${tabBar('tones')}
    <section class="refgroup">
      <div class="refgrid">${REF.tones.map(([form,thai,ph,eff]) => refCard(
        `<div class="form th">${form}</div><div class="nm th">${thai}</div>
         <div class="ph">${ph}</div><span class="snd">${eff}</span>`)).join('')}</div>
    </section>
    <div class="refnote">The tone shown is the result on a live syllable beginning with a
      <strong>mid-class</strong> consonant. High- and low-class initials change the outcome, and
      ไม้ตรี and ไม้จัตวา are written almost only on mid-class consonants. This is why the consonant
      class on the previous tab matters for reading.</div>`;
}

function renderNumerals(){
  $('#app').innerHTML = `
    <div class="crumb">Thai alphabet</div>
    <h1>Thai numerals <span class="lead">— ๐ to ๙.</span></h1>
    <p class="intro">Arabic digits are used for most everyday purposes in Thailand. Thai numerals
      still turn up on temple signage, official documents, banknotes and some market prices.</p>
    ${tabBar('numbers')}
    <section class="refgroup">
      <div class="refgrid">${NUMS.map(d => `
        <a class="tile" href="#/${d.id}">
          <div class="big th">${d.ch}</div>
          <div class="ar">${d.mean}</div>
          <div class="nm th">${d.thai}</div>
          <div class="ph">${d.name}</div>
          <span class="arrowlink">practise writing &rarr;</span>
        </a>`).join('')}</div>
    </section>
    <div class="refnote">Stroke order here was read off a children's handwriting video frame by
      frame — tracking where fresh ink appeared, then fitting that path to the Sarabun letterform.
      ๐ is taken from the right-hand character of ๑๐, the only place the video writes it.</div>`;
}

/* ---------------- grid ---------------- */
function renderGrid(filter){
  const tiles = DATA.map(d => `
    <a class="tile ${d.cls} ${filter && filter!==d.cls ? 'dim':''}" href="#/${d.id}">
      <span class="dot ${d.cls}" title="${CLASSNAME[d.cls]}"></span>
      <div class="big th">${d.ch}</div>
      <div class="nm th">${d.thai}</div>
      <div class="ph">${d.name}</div>
      <div class="mn">${d.mean}</div>
      ${d.icon || ''}
    </a>`).join('');
  $('#app').innerHTML = `
    <div class="crumb">Thai alphabet</div>
    <h1>Thai consonants <span class="lead">— tap a letter to practise writing it.</span></h1>
    <p class="intro">All 44 consonants with animated stroke order. Each letter fills in as the pen
      moves, then hands the space over to you to trace with your finger.</p>
    ${tabBar('')}
    <div class="filters">
      <button data-f="" aria-pressed="${!filter}">All 44</button>
      <button class="high" data-f="high" aria-pressed="${filter==='high'}">High class · 11</button>
      <button class="mid" data-f="mid" aria-pressed="${filter==='mid'}">Middle class · 9</button>
      <button class="low" data-f="low" aria-pressed="${filter==='low'}">Low class · 24</button>
    </div>
    <div class="grid">${tiles}</div>`;
  document.querySelectorAll('.filters button').forEach(b =>
    b.onclick = () => renderGrid(b.dataset.f || null));
}

/* ---------------- detail ---------------- */
function renderDetail(id){
  const isNum = id.charAt(0) === 'n';
  const SET = isNum ? NUMS : DATA;
  const d = SET.find(x => x.id === id);
  if(!d) return renderGrid(null);
  const i = SET.indexOf(d);
  const prev = SET[(i-1+SET.length)%SET.length], next = SET[(i+1)%SET.length];
  const back = isNum ? ['#/numbers','Thai numerals'] : ['#/','Thai alphabet'];
  const badge = isNum ? 'THAI NUMERAL' : CLASSNAME[d.cls].toUpperCase();

  $('#app').innerHTML = `
    <div class="crumb"><a href="${back[0]}">${back[1]}</a> &nbsp;/&nbsp; <span class="th">${d.ch}</span></div>
    <h1>Practice the stroke <span class="lead">— watch it, then draw it yourself.</span></h1>
    <div class="detail">
      <div class="card ${d.cls}">
        <span class="badge ${d.cls}"><i class="dot ${d.cls}"></i>${badge}</span>
        <div class="idhead">
          <div class="big th">${d.ch}</div>
          <div>
            <div class="nm th">${d.thai}</div>
            <div class="ph">${d.name}</div>
            <div class="mn">${d.mean}</div>
          </div>
          ${d.icon || ''}
        </div>
        <div class="rowbtn">
          <button id="say">🔊 Pronunciation</button>
          <button id="copy">Copy character</button>
          <button id="replay">Replay</button>
        </div>
        <div class="note">${d.strokeNote}${d.derived ? '<br><br>The stroke path for this letter was derived and cross-checked, not taken from a published source.' : ''}</div>
        <div class="nav2">
          <a href="#/${prev.id}">&larr; <span class="th">${prev.ch}</span> ${prev.name}</a>
          <a href="#/${next.id}"><span class="th">${next.ch}</span> ${next.name} &rarr;</a>
        </div>
      </div>

      <div class="panel">
        <div class="stage" id="stage">
          <img class="art" id="art" src="${d.png}" alt="${d.name}">
          <div class="guides"><span class="t"></span><span class="b"></span></div>
          <canvas class="ink" id="ink"></canvas>
          <button class="playbtn" id="play" aria-label="Play stroke order"><span class="tri"></span></button>
        </div>
        <div class="controls">
          <button class="pill ${d.cls}" id="show" aria-pressed="true"><span class="ic"></span>Show</button>
          <button class="pill ${d.cls}" id="shadow" aria-pressed="false"><span class="ic"></span>Shadow practice</button>
          <button class="pill ${d.cls}" id="practice" aria-pressed="false"><span class="ic"></span>Practice</button>
          <button class="pill" id="clear">Clear ink</button>
        </div>
        <div class="hint" id="hint">Press play to watch the strokes.</div>
      </div>
    </div>`;

  setupPractice(d);
}

/* ---------------- animation + drawing ---------------- */
function setupPractice(d){
  const stage=$('#stage'), art=$('#art'), hint=$('#hint');
  const showBtn=$('#show'), shadBtn=$('#shadow'), pracBtn=$('#practice');
  let timer=null;
  function press(active){
    showBtn.setAttribute('aria-pressed', String(active==='show'));
    shadBtn.setAttribute('aria-pressed', String(active==='shadow'));
    pracBtn.setAttribute('aria-pressed', String(active==='practice'));
  }

  function stop(){ clearTimeout(timer); timer=null; stage.classList.remove('playing');
    if(!stage.classList.contains('shadow')) art.src=d.png; }
  function showMode(){
    stage.classList.remove('blank','shadow');
    art.src=d.png; press('show');
    hint.textContent='Press play to watch the strokes.';
  }
  function shadowMode(){
    stop();
    stage.classList.remove('blank'); stage.classList.add('shadow');
    art.src=d.out; press('shadow');
    hint.textContent='Trace inside the outline with your finger — tap Show to watch the strokes again.';
  }
  function play(){
    if(stage.classList.contains('blank')||stage.classList.contains('shadow')) showMode();
    clearTimeout(timer);
    stage.classList.add('playing');
    art.src = d.gif + '?t=' + Date.now();      // cache-bust so it restarts at frame 1
    hint.textContent='Watch the order — the red dot is the pen.';
    timer=setTimeout(()=>{ stop(); hint.textContent='Now tap Practice and try it yourself.'; }, d.ms);
  }
  function practiceMode(){
    stop();
    stage.classList.remove('shadow'); stage.classList.add('blank');
    press('practice');
    hint.textContent='Blank space — draw the letter from memory.';
  }

  $('#play').onclick=play;
  $('#replay').onclick=play;
  showBtn.onclick=showMode;
  shadBtn.onclick=shadowMode;
  pracBtn.onclick=practiceMode;
  $('#say').onclick=async e=>{
    // A real recording beats synthesis on every device, so try it first. Only
    // the consonants have one; numerals fall through to the speech API.
    if(d.audio){
      try{
        if(window._clip){ window._clip.pause(); }
        const clip=new Audio(d.audio);
        window._clip=clip;
        hint.textContent='Playing the recorded name.';
        clip.onended=()=>{ hint.textContent='Press play to watch the strokes.'; };
        await clip.play();
        return;
      }catch(err){ /* file missing or blocked — fall through to synthesis */ }
    }
    const synth=window.speechSynthesis;
    if(!synth){ hint.textContent='Speech is not available in this browser.'; return; }
    // getVoices() is empty until Chrome finishes loading the list, so wait for it
    // rather than silently falling back to an English voice reading Thai text.
    const voices=await voicesReady();
    const th=voices.find(v=>/^th/i.test(v.lang||''));
    synth.cancel();
    const u=new SpeechSynthesisUtterance(d.thai);   // e.g. กอ ไก่
    u.lang='th-TH'; u.rate=0.8;
    if(th) u.voice=th;
    else hint.textContent='No Thai voice installed — Windows: Settings › Time & Language › Speech › Add voices › Thai.';
    // cancel() is asynchronous in Chrome; speaking in the same tick can drop the
    // utterance, which is the usual cause of "the first click does nothing".
    setTimeout(()=>synth.speak(u),60);
  };
  $('#copy').onclick=e=>{
    navigator.clipboard?.writeText(d.ch);
    e.target.textContent='Copied '+d.ch;
    setTimeout(()=>e.target.textContent='Copy character',1200);
  };

  /* finger drawing, sized for retina */
  const cv=$('#ink'), ctx=cv.getContext('2d');
  let strokes=[], cur=null;
  const dpr=Math.min(window.devicePixelRatio||1, 3);

  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#15133a';
    ctx.lineWidth=Math.max(6, cv.width*0.022);
    for(const s of strokes){
      if(s.length<2) continue;
      ctx.beginPath(); ctx.moveTo(s[0].x*cv.width, s[0].y*cv.height);
      for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x*cv.width, s[i].y*cv.height);
      ctx.stroke();
    }
  }
  function resize(){
    const r=cv.getBoundingClientRect();
    if(!r.width) return;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    redraw();
  }
  const pos=e=>{ const r=cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };

  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId); cur=[pos(e)]; strokes.push(cur); redraw(); e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; cur.push(pos(e)); redraw(); e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>
    cv.addEventListener(t,()=>{ cur=null; }));

  $('#clear').onclick=()=>{ strokes=[]; cur=null; redraw(); };

  new ResizeObserver(resize).observe(cv);
  resize();
}

/* ---------------- routing ---------------- */
function route(){
  const h=location.hash;
  const m=h.match(/^#\/(n?\d{2})$/);
  window.scrollTo(0,0);
  if(m) renderDetail(m[1]);
  else if(h==='#/vowels') renderVowels();
  else if(h==='#/tones') renderTones();
  else if(h==='#/numbers') renderNumerals();
  else renderGrid(null);
}
addEventListener('hashchange', route);
route();
</script>
</body></html>
